name: Deploy Burro Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/burro
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}

jobs:
  build:
    name: Build all apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (non-blocking)
        run: pnpm -r --if-present lint || true

      - name: Build student
        run: pnpm build:student
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.burroarab.uz' }}

      - name: Build parent
        run: pnpm build:parent
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.burroarab.uz' }}

      - name: Build admin
        run: pnpm build:admin
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.burroarab.uz' }}

      - name: Verify dist outputs
        run: |
          [ -d apps/student/dist ] || (echo "student dist missing" && exit 1)
          [ -d apps/parent/dist  ] || (echo "parent dist missing"  && exit 1)
          [ -d apps/admin/dist   ] || (echo "admin dist missing"   && exit 1)
          echo "All 3 dist folders present"

      - name: Create release tarball
        run: |
          tar -czf release.tar.gz \
            apps/student/dist \
            apps/parent/dist \
            apps/admin/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload tarball to server
        run: |
          scp release.tar.gz ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:/tmp/burro-release.tar.gz

      - name: Extract and deploy
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'EOF'
            set -e

            # Prepare target dirs
            mkdir -p /var/www/burro/apps/student
            mkdir -p /var/www/burro/apps/parent
            mkdir -p /var/www/burro/apps/admin

            # Backup current dist (rollback point)
            ts=$(date +%Y%m%d_%H%M%S)
            [ -d /var/www/burro/apps/student/dist ] && \
              cp -r /var/www/burro/apps/student/dist /var/www/burro/apps/student/dist_backup_$ts
            [ -d /var/www/burro/apps/parent/dist ] && \
              cp -r /var/www/burro/apps/parent/dist /var/www/burro/apps/parent/dist_backup_$ts
            [ -d /var/www/burro/apps/admin/dist ] && \
              cp -r /var/www/burro/apps/admin/dist /var/www/burro/apps/admin/dist_backup_$ts

            # Extract new release
            cd /var/www/burro
            tar -xzf /tmp/burro-release.tar.gz

            # Cleanup tarball
            rm /tmp/burro-release.tar.gz

            # Clean old backups (keep last 2)
            for app in student parent admin; do
              ls -dt /var/www/burro/apps/$app/dist_backup_* 2>/dev/null | tail -n +3 | xargs rm -rf
            done

            echo "Deploy complete: $(date)"
          EOF

      - name: Health check
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'EOF'
            check() {
              local name=$1
              local path=$2
              if [ -f "$path/index.html" ]; then
                echo "✓ $name dist present"
              else
                echo "✗ $name dist MISSING — rollback needed"
                exit 1
              fi
            }
            check student /var/www/burro/apps/student/dist
            check parent  /var/www/burro/apps/parent/dist
            check admin   /var/www/burro/apps/admin/dist
            echo "All health checks passed"
          EOF
