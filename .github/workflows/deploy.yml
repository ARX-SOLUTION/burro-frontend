name: Deploy Burro Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/burro
  SSH_HOST: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
  SSH_USER: ${{ secrets.SSH_USER || 'root' }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}

jobs:
  build:
    name: Build all apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (non-blocking)
        run: pnpm -r --if-present lint || true

      - name: Build student
        run: pnpm build:student
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.burroarab.uz' }}

      - name: Build parent
        run: pnpm build:parent
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.burroarab.uz' }}

      - name: Build admin
        run: pnpm build:admin
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.burroarab.uz' }}

      - name: Verify dist outputs
        run: |
          [ -d apps/student/dist ] || (echo "student dist missing" && exit 1)
          [ -d apps/parent/dist  ] || (echo "parent dist missing"  && exit 1)
          [ -d apps/admin/dist   ] || (echo "admin dist missing"   && exit 1)
          echo "All 3 dist folders present"

      - name: Create release tarball
        run: |
          tar -czf release.tar.gz \
            apps/student/dist \
            apps/parent/dist \
            apps/admin/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Missing SSH_HOST secret. Set SSH_HOST, or keep legacy SERVER_HOST."
            exit 1
          fi
          if [ -z "${SSH_USER:-}" ]; then
            echo "::error::Missing SSH_USER secret."
            exit 1
          fi
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing SSH_PRIVATE_KEY secret. Set SSH_PRIVATE_KEY, or keep legacy SERVER_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload tarball to server
        run: |
          scp release.tar.gz "$SSH_USER@$SSH_HOST:/tmp/burro-release.tar.gz"

      - name: Extract and deploy
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            mkdir -p /var/www/burro/apps/student
            mkdir -p /var/www/burro/apps/parent
            mkdir -p /var/www/burro/apps/admin
            mkdir -p /var/log/pm2

            ts=$(date +%Y%m%d_%H%M%S)
            [ -d /var/www/burro/apps/student/dist ] && \
              cp -r /var/www/burro/apps/student/dist /var/www/burro/apps/student/dist_backup_$ts
            [ -d /var/www/burro/apps/parent/dist ] && \
              cp -r /var/www/burro/apps/parent/dist /var/www/burro/apps/parent/dist_backup_$ts
            [ -d /var/www/burro/apps/admin/dist ] && \
              cp -r /var/www/burro/apps/admin/dist /var/www/burro/apps/admin/dist_backup_$ts

            cd /var/www/burro
            tar -xzf /tmp/burro-release.tar.gz

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is required on the server"
              exit 1
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 is required on the server"
              exit 1
            fi
            if ! command -v serve >/dev/null 2>&1; then
              npm install -g serve
            fi

            SERVE_BIN=$(command -v serve)

            {
              printf '%s\n' "module.exports = {"
              printf '%s\n' "  apps: ["
              printf '%s\n' "    {"
              printf '%s\n' "      name: 'burro-student',"
              printf '%s\n' "      script: '$SERVE_BIN',"
              printf '%s\n' "      args: '-s apps/student/dist -l 5173 --no-clipboard',"
              printf '%s\n' "      cwd: '/var/www/burro',"
              printf '%s\n' "      interpreter: 'none',"
              printf '%s\n' "      env: { NODE_ENV: 'production' },"
              printf '%s\n' "      error_file: '/var/log/pm2/burro-student-error.log',"
              printf '%s\n' "      out_file: '/var/log/pm2/burro-student-out.log',"
              printf '%s\n' "      time: true,"
              printf '%s\n' "      autorestart: true,"
              printf '%s\n' "      max_restarts: 5,"
              printf '%s\n' "      restart_delay: 2000"
              printf '%s\n' "    },"
              printf '%s\n' "    {"
              printf '%s\n' "      name: 'burro-parent',"
              printf '%s\n' "      script: '$SERVE_BIN',"
              printf '%s\n' "      args: '-s apps/parent/dist -l 5174 --no-clipboard',"
              printf '%s\n' "      cwd: '/var/www/burro',"
              printf '%s\n' "      interpreter: 'none',"
              printf '%s\n' "      env: { NODE_ENV: 'production' },"
              printf '%s\n' "      error_file: '/var/log/pm2/burro-parent-error.log',"
              printf '%s\n' "      out_file: '/var/log/pm2/burro-parent-out.log',"
              printf '%s\n' "      time: true,"
              printf '%s\n' "      autorestart: true,"
              printf '%s\n' "      max_restarts: 5,"
              printf '%s\n' "      restart_delay: 2000"
              printf '%s\n' "    },"
              printf '%s\n' "    {"
              printf '%s\n' "      name: 'burro-admin',"
              printf '%s\n' "      script: '$SERVE_BIN',"
              printf '%s\n' "      args: '-s apps/admin/dist -l 5175 --no-clipboard',"
              printf '%s\n' "      cwd: '/var/www/burro',"
              printf '%s\n' "      interpreter: 'none',"
              printf '%s\n' "      env: { NODE_ENV: 'production' },"
              printf '%s\n' "      error_file: '/var/log/pm2/burro-admin-error.log',"
              printf '%s\n' "      out_file: '/var/log/pm2/burro-admin-out.log',"
              printf '%s\n' "      time: true,"
              printf '%s\n' "      autorestart: true,"
              printf '%s\n' "      max_restarts: 5,"
              printf '%s\n' "      restart_delay: 2000"
              printf '%s\n' "    }"
              printf '%s\n' "  ]"
              printf '%s\n' "}"
            } > /var/www/burro/ecosystem.config.js

            cp /var/www/burro/ecosystem.config.js /var/www/burro/ecosystem.config.js.bak
            pm2 startOrReload /var/www/burro/ecosystem.config.js --update-env
            pm2 save

            rm /tmp/burro-release.tar.gz

            for app in student parent admin; do
              ls -dt /var/www/burro/apps/$app/dist_backup_* 2>/dev/null | tail -n +3 | xargs rm -rf
            done

            echo "Deploy complete: $(date)"
          EOF

      - name: Health check
        run: |
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            sleep 3
            check_port() {
              name=$1
              port=$2
              if curl -sf "http://localhost:$port" > /dev/null; then
                echo "$name OK"
              else
                echo "$name FAIL"
                exit 1
              fi
            }
            check_port student 5173
            check_port parent 5174
            check_port admin 5175
            pm2 list
          EOF
