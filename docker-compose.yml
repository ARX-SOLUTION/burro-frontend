services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:4000/api}
        ports:
            # map host 8080 to container nginx port 80 to avoid conflicts with host port 80/3000
            - "8080:80"
        restart: unless-stopped
